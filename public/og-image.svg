<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="60%" stop-color="#05070B"/>
      <stop offset="100%" stop-color="#020305"/>
    </linearGradient>

    <!-- Ambient Crimson Glow on right/top -->
    <radialGradient id="ambient-glow" cx="65%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0.18"/>
      <stop offset="45%" stop-color="#BE123C" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Crimson Gradient -->
    <linearGradient id="crimson-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>

    <!-- Subtle Tech Grid -->
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M 56 0 L 0 0 0 56" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#ambient-glow)"/>

  <!-- Subtle Outer Border -->
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>

  <!-- ==================================================== -->
  <!-- 1. Top Brand Lockup: Perfectly Proportioned & Aligned -->
  <!-- ==================================================== -->
  <g transform="translate(96, 75)">
    <!-- Red OG Monogram (Height: ~60px, Width: ~55px, perfectly framing wordmark) -->
    <g transform="scale(0.68) translate(-9, -11.23)">
      <path d="M 47.8,11.23 L 9,33 L 9,79 L 47.8,100.77 Z M 35.3,32.54 L 21.5,40.28 L 21.5,71.72 L 35.3,79.46 Z" fill="#E11D48" fill-rule="evenodd" />
      <path d="M 52.2,11.23 L 52.2,100.77 L 91,79 L 91,50 L 71,50 L 71,62.5 L 78.5,62.5 L 78.5,71.72 L 64.7,79.46 L 64.7,32.54 L 78.5,40.28 L 91,40.28 L 91,33 Z" fill="#E11D48" />
    </g>

    <!-- Wordmark (Center at Y=30.4, Baseline at Y=50 - optically balanced) -->
    <text x="74" y="50" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="750" fill="#FFFFFF" letter-spacing="-1.5">Ollagraph</text>
  </g>

  <!-- ==================================================== -->
  <!-- 2. Main Headline                                     -->
  <!-- ==================================================== -->
  <g transform="translate(96, 245)">
    <!-- Line 1 -->
    <text x="0" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="74" font-weight="800" fill="#F8FAFC" letter-spacing="-2.6">Web infrastructure</text>
    
    <!-- Line 2 -->
    <text x="0" y="92" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="74" font-weight="800" letter-spacing="-2.6">
      <tspan fill="#F8FAFC">for </tspan>
      <tspan fill="url(#crimson-grad)">AI agents.</tspan>
    </text>
  </g>

  <!-- ==================================================== -->
  <!-- 3. Feature Badges (Enlarged & High-Contrast)          -->
  <!-- ==================================================== -->
  <g transform="translate(96, 410)">
    <!-- Badge 1: 147 Endpoints -->
    <g transform="translate(0, 0)">
      <rect width="245" height="56" rx="12" fill="#0A0F1D" fill-opacity="0.92" stroke="rgba(255,255,255,0.14)" stroke-width="1.3"/>
      <circle cx="28" cy="28" r="5.5" fill="#E11D48"/>
      <text x="48" y="36.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24.5" font-weight="600" fill="#F8FAFC" letter-spacing="-0.4">147 Endpoints</text>
    </g>

    <!-- Badge 2: MCP Native -->
    <g transform="translate(261, 0)">
      <rect width="218" height="56" rx="12" fill="#0A0F1D" fill-opacity="0.92" stroke="rgba(255,255,255,0.14)" stroke-width="1.3"/>
      <circle cx="28" cy="28" r="5.5" fill="#0284C7"/>
      <text x="48" y="36.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24.5" font-weight="600" fill="#F8FAFC" letter-spacing="-0.4">MCP Native</text>
    </g>

    <!-- Badge 3: 1,000 Free Credits -->
    <g transform="translate(495, 0)">
      <rect width="295" height="56" rx="12" fill="#0A0F1D" fill-opacity="0.92" stroke="rgba(255,255,255,0.14)" stroke-width="1.3"/>
      <circle cx="28" cy="28" r="5.5" fill="#10B981"/>
      <text x="48" y="36.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24.5" font-weight="600" fill="#F8FAFC" letter-spacing="-0.4">1,000 Free Credits</text>
    </g>
  </g>

  <!-- ==================================================== -->
  <!-- 4. Footer URL                                        -->
  <!-- ==================================================== -->
  <text x="96" y="542" font-family="'Consolas', 'Cascadia Code', 'JetBrains Mono', monospace" font-size="26" font-weight="600" fill="#94A3B8" letter-spacing="0.5">
    ollagraph.com
  </text>
</svg>
