<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050507"/>
      <stop offset="1" stop-color="#0c0c11"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="rgba(29,78,216,0.18)"/>
      <stop offset="100%" stop-color="rgba(29,78,216,0)"/>
    </radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M 56 0 L 0 0 0 56" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Logo mark -->
  <g transform="translate(80, 80)">
    <path d="M60 5L10 32.5v55L60 115l50-27.5v-55L60 5Z" stroke="url(#mark)" stroke-width="3" fill="none" stroke-linejoin="round"/>
    <path d="M60 30L33 45v30l27 15 27-15V45L60 30Z" stroke="#1D4ED8" stroke-width="3" fill="rgba(29,78,216,0.25)" stroke-linejoin="round"/>
    <circle cx="60" cy="60" r="6" fill="#1D4ED8"/>
  </g>
  <text x="220" y="138" font-family="Inter Tight, Inter, sans-serif" font-size="56" font-weight="500" fill="#f3f3f5" letter-spacing="-1.5">Ollagraph</text>

  <!-- Tagline -->
  <text x="80" y="350" font-family="Inter Tight, Inter, sans-serif" font-size="92" font-weight="600" fill="#f3f3f5" letter-spacing="-3">Web infrastructure</text>
  <text x="80" y="450" font-family="Inter Tight, Inter, sans-serif" font-size="92" font-weight="600" letter-spacing="-3">
    <tspan fill="#f3f3f5">for</tspan><tspan fill="#1D4ED8" dx="22">AI agents.</tspan>
  </text>

  <!-- Subline -->
  <text x="80" y="540" font-family="Inter, sans-serif" font-size="28" fill="#9a9aa3">221 endpoints. One API. One MCP server. One bill.</text>

  <!-- URL -->
  <text x="80" y="595" font-family="JetBrains Mono, monospace" font-size="20" fill="#56565f">ollagraph.com</text>
</svg>
