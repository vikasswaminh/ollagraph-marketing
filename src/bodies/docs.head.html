<style>
    /* ---- Method pills (shared: sidebar + endpoint headers) ---- */
    .ep-method, .ds-m { font-family: var(--font-mono); font-weight: 600; border-radius: 5px; text-align: center; letter-spacing: 0.04em; }
    .ep-method { font-size: 11px; padding: 3px 9px; min-width: 52px; }
    .ds-m { font-size: 9px; padding: 2px 5px; min-width: 38px; flex-shrink: 0; }
    .m-get    { background: rgba(94,234,212,0.12);  color: #5eead4; }
    .m-post   { background: rgba(199,247,81,0.12);  color: #c7f751; }
    .m-put    { background: rgba(167,139,250,0.12); color: #a78bfa; }
    .m-patch  { background: rgba(255,200,121,0.12); color: #ffc879; }

    /* ---- 3-pane layout ---- */
    .docs-layout { display: grid; grid-template-columns: 272px minmax(0, 1fr); max-width: 1240px; margin: 0 auto; align-items: start; }

    .docs-sidebar { position: sticky; top: 0; max-height: 100vh; overflow-y: auto; padding: 22px 14px 40px; border-right: 1px solid var(--border); }

    .ds-search:focus { outline: none; border-color: var(--accent); }
    .ds-nav { display: flex; flex-direction: column; }
    .ds-top { color: var(--text-muted); font-size: 13px; padding: 6px 8px; border-radius: 6px; }
    .ds-top:hover { color: var(--text); background: rgba(255,255,255,0.03); }
    .ds-divider { height: 1px; background: var(--border); margin: 10px 4px; }
    .ds-group { margin-bottom: 8px; }
    .ds-group-h { display: block; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-dim); font-weight: 600; padding: 12px 8px 5px; }

    .ds-link { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-radius: 6px; color: var(--text-muted); }
    .ds-link:hover { background: rgba(255,255,255,0.03); color: var(--text); }
    .ds-link.active { background: var(--accent-glow); color: var(--text); }
    .ds-p { font-family: var(--font-mono); font-size: 11px; word-break: break-all; line-height: 1.35; }

    /* ---- Main content ---- */
    .docs-main { padding: 40px 44px 96px; min-width: 0; max-width: 920px; }
    .ds-section { padding-top: 24px; }
    .ds-section + .ds-section { border-top: 1px solid var(--border); margin-top: 8px; }
    .ds-section-h h1, .ds-section-h h2 { font-family: var(--font-display); margin: 0 0 8px; }
    .ds-section-h h2 { font-size: 26px; }
    .ds-section-h > p { color: var(--text-muted); font-size: 14px; line-height: 1.65; margin: 0 0 8px; max-width: 660px; }

    .ep-detail { padding: 26px 0; border-top: 1px dashed var(--border); scroll-margin-top: 20px; }

    .ep-h { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .ep-fullpath { font-family: var(--font-mono); font-size: 14px; color: var(--text); background: none !important; padding: 0 !important; word-break: break-all; }

    .ep-block h4 { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); margin: 0 0 8px; }

    .ep-params { width: 100%; border-collapse: collapse; font-size: 13px; }
    .ep-params th { text-align: left; font-weight: 600; color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; padding: 6px 12px 6px 0; border-bottom: 1px solid var(--border); }
    .ep-params td { padding: 8px 12px 8px 0; border-bottom: 1px solid var(--border); color: var(--text-muted); vertical-align: top; }

    .ep-params .t-type { font-family: var(--font-mono); font-size: 12px; color: #5eead4; }
    .req { color: #ffc879; font-size: 11px; font-weight: 600; }
    .opt { color: var(--text-dim); font-size: 11px; }

    .ep-code { background: rgba(0,0,0,0.35); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; overflow-x: auto; font-family: var(--font-mono); font-size: 12px; line-height: 1.55; color: var(--text); margin: 0; white-space: pre; }
    .qs-comment { color: var(--text-dim); }
    .qs-cmd { color: var(--accent); }

    @media (max-width: 920px) {

      .docs-sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: 280px; max-height: none; background: var(--bg); z-index: 60; transform: translateX(-100%); transition: transform 0.2s ease; box-shadow: 0 0 40px rgba(0,0,0,0.5); }
      .docs-sidebar.open { transform: translateX(0); }
      .docs-main { padding: 28px 20px 80px; max-width: 100%; }
      .ds-mobile-toggle { display: inline-flex; align-items: center; gap: 6px; position: sticky; top: 12px; margin: 12px 0 0 16px; z-index: 50; background: var(--card); border: 1px solid var(--border-2); color: var(--text); font-size: 13px; padding: 8px 14px; border-radius: 8px; cursor: pointer; }
    }
</style>
