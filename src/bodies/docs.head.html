<style>
    .bg-grid { display: none; }
    .docs-top {
      height: 56px;
      border-bottom: 1px solid var(--border);
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(20px);
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center;
    }
    .docs-top .inner { display: flex; align-items: center; gap: 24px; padding: 0 28px; width: 100%; }
    .docs-top .nav-logo { font-family: var(--font-display); font-weight:600; font-size:15px; display:flex; align-items:center; gap:9px; }
    .docs-top .nav-logo svg { width:20px; height:20px; }
    .docs-top .links { display:flex; gap:18px; font-size: 13px; color: var(--text-muted); }
    .docs-top .links a { padding: 6px 0; transition: color 0.15s; }
    .docs-top .links a.active { color: var(--text); }
    .docs-top .search { width:340px; height:32px; border:1px solid var(--border); border-radius:7px; background:rgba(255,255,255,0.03); padding:0 10px; display:flex; align-items:center; gap:8px; color:var(--text-muted); font-size:12.5px; }
    .docs-top .search kbd { margin-left:auto; font-family:var(--font-mono); font-size:10px; padding:1px 5px; border-radius:4px; border:1px solid var(--border-2); background:rgba(255,255,255,0.05); }

    .docs-grid {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr) 240px;
      gap: 0;
      max-width: 1440px; margin: 0 auto;
      align-items: start;
    }

    /* Left sidebar */
    .docs-side {
      position: sticky; top: 56px;
      padding: 28px 18px 64px 28px;
      max-height: calc(100vh - 56px);
      overflow-y: auto;
      border-right: 1px solid var(--border);
    }
    .ds-group h4 {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em;
      color: var(--text-muted); margin: 22px 0 8px; font-weight: 500;
    }
    .ds-group:first-child h4 { margin-top: 0; }
    .ds-item {
      display: flex; align-items: center; gap: 7px;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 1px;
    }
    .ds-item:hover { color: var(--text); background: rgba(255,255,255,0.03); }
    .ds-item.active { color: var(--text); background: rgba(199,247,81,0.08); }
    .ds-item.active::before { content: ""; width:3px; height:14px; background:var(--accent); margin-left:-13px; margin-right:6px; border-radius:2px; }
    .ds-item .method {
      font-family: var(--font-mono);
      font-size: 9.5px;
      padding: 2px 5px;
      border-radius: 3px;
      letter-spacing: 0.04em;
    }
    .m-get { background: rgba(94,234,212,0.12); color: var(--cyan); }
    .m-post { background: rgba(199,247,81,0.12); color: var(--accent); }
    .m-del { background: rgba(248,113,113,0.12); color: var(--rose); }
    .m-put { background: rgba(251,191,36,0.12); color: var(--amber); }

    /* Main content */
    .docs-main {
      padding: 56px 56px 96px;
      min-width: 0;
    }
    .docs-crumb { font-size: 12.5px; color: var(--text-muted); display:flex; gap:8px; align-items:center; margin-bottom: 20px; }
    .docs-crumb .sep { color: var(--text-faint); }
    .docs-h1 {
      font-family: var(--font-display);
      font-size: 40px;
      letter-spacing: -0.03em;
      font-weight: 500;
      margin: 0 0 14px;
    }
    .docs-lede { font-size: 16px; color: var(--text-muted); line-height: 1.6; max-width: 620px; margin: 0 0 36px; }
    .docs-h2 {
      font-family: var(--font-display);
      font-size: 22px;
      letter-spacing: -0.02em;
      font-weight: 500;
      margin: 56px 0 16px;
    }
    .docs-h3 {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 500;
      margin: 28px 0 10px;
    }
    .docs-p { font-size: 14.5px; line-height: 1.7; color: var(--text-muted); margin: 0 0 14px; max-width: 660px; }
    .docs-p code, .inline-code { font-family: var(--font-mono); font-size: 12.5px; padding: 1px 6px; border-radius: 4px; background: rgba(255,255,255,0.05); color: var(--text); border: 1px solid var(--border); }

    /* Param table */
    .param-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    .param-table th, .param-table td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
    .param-table th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); font-weight: 500; }
    .param-name { font-family: var(--font-mono); color: var(--text); font-size: 13px; }
    .param-type { font-family: var(--font-mono); color: var(--cyan); font-size: 12px; }
    .param-req { font-family: var(--font-mono); color: var(--rose); font-size: 11px; }
    .param-opt { font-family: var(--font-mono); color: var(--text-dim); font-size: 11px; }
    .param-desc { color: var(--text-muted); font-size: 13px; }

    /* Right TOC */
    .docs-toc {
      position: sticky; top: 56px;
      padding: 56px 28px 64px 18px;
      max-height: calc(100vh - 56px);
      overflow-y: auto;
      font-size: 12.5px;
    }
    .docs-toc h5 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-muted); margin: 0 0 12px; font-weight: 500; }
    .docs-toc a { display: block; padding: 4px 0; color: var(--text-muted); }
    .docs-toc a:hover { color: var(--text); }
    .docs-toc a.active { color: var(--accent); }

    /* Endpoint header */
    .endpoint-row {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px;

      border-radius: 9px;
      margin: 20px 0 36px;
      font-family: var(--font-mono);
      font-size: 13px;
    }
    .endpoint-method { padding: 4px 9px; border-radius: 5px; font-size: 11.5px; letter-spacing: 0.06em; }
    .endpoint-path { color: var(--text); }
    .endpoint-row .copy { margin-left:auto; color:var(--text-muted); padding:4px; border-radius:5px; }
    .endpoint-row .copy:hover { background: rgba(255,255,255,0.05); color:var(--text); }

    /* Two-col docs layout: prose left / code right */
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: start; margin-top: 18px; }
    @media (max-width: 1280px) {
      .docs-grid { grid-template-columns: 240px minmax(0, 1fr); }
      .docs-toc { display: none; }
    }
    @media (max-width: 980px) {
      .two-col { grid-template-columns: 1fr; }
      .docs-grid { grid-template-columns: 1fr; }
      .docs-side { display: none; }
      .docs-main { padding: 32px 24px; }
    }

    .resp-card {
      background: #08080c;
      border: 1px solid var(--border);
      border-radius: 9px;
      overflow: hidden;
      font-family: var(--font-mono);
      font-size: 12.5px;
    }
    .resp-head { padding: 8px 12px; border-bottom: 1px solid var(--border); display:flex; gap:10px; align-items:center; font-size:11.5px; color: var(--text-muted); }
    .resp-body { padding: 12px 14px; line-height: 1.7; }

    .tab-bar { display: flex; gap: 4px; }
    .tab-bar button { padding: 5px 10px; border-radius: 5px; font-family: var(--font-mono); font-size: 11.5px; color: var(--text-muted); }
    .tab-bar button.active { background: rgba(199,247,81,0.1); color: var(--accent); }
    .tab-bar button:hover { color: var(--text); }

    .callout {
      border-left: 3px solid var(--accent);
      background: rgba(199,247,81,0.04);
      padding: 14px 18px;
      border-radius: 0 9px 9px 0;
      margin: 18px 0;
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.6;
    }
    .callout strong { color: var(--text); }
  </style>
