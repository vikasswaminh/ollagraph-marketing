<style>
    .plans { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .plan {
      padding: 28px;
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 0px;
      display: flex; flex-direction: column;
      position: relative;
    }
    .plan.featured {
      background: #FFFFFF;
      border-top: 3px solid #E8443A;
      box-shadow: 0 8px 24px -4px rgba(0,0,0,0.06);
    }
    .plan h3 { font-family: var(--font-display); font-size: 18px; font-weight: 650; margin: 0; letter-spacing: -0.01em; color: #0F172A; }
    .plan-price { font-family: var(--font-mono); font-size: 44px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; margin: 18px 0 8px; color: #0F172A; }
    .plan-price .unit { font-size: 14px; color: var(--text-muted); margin-left: 4px; letter-spacing: 0; font-family: var(--font-body); }
    .plan-sub { font-size: 13px; color: var(--text-muted); }
    .plan ul { list-style: none; padding: 0; margin: 24px 0 0; display: flex; flex-direction: column; gap: 12px; font-size: 13px; }
    .plan ul li { display: flex; align-items: flex-start; gap: 10px; color: var(--text); }
    .plan ul li::before {
      content: "";
      width: 16px; height: 16px;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2310B981' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='20 6 9 17 4 12'/></svg>");
      background-size: 13px; background-position: center; background-repeat: no-repeat;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .plan ul li .muted { color: var(--text-muted); font-size: 12px; display: block; }
    .plan-cta { margin-top: 28px; }
    .plan-tag { position: absolute; top: -10px; right: 28px; background: #E8443A; color: #FFFFFF; font-family: var(--font-mono); font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 0px; letter-spacing: 0.08em; }

    .calc {
      padding: 32px;
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 0px;
    }
    .slider-wrap { position: relative; }
    .slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      background: linear-gradient(90deg, #E8443A 0%, #E8443A var(--pct, 25%), #E2E8F0 var(--pct, 25%));
      border-radius: 0px;
      outline: none;
    }
    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px; height: 18px;
      border-radius: 0px;
      background: #E8443A;
      border: 2px solid #FFFFFF;
      box-shadow: 0 0 0 1px #E8443A;
      cursor: pointer;
    }
    .slider::-moz-range-thumb {
      width: 18px; height: 18px;
      border-radius: 0px;
      background: #E8443A;
      border: 2px solid #FFFFFF;
      cursor: pointer;
    }
    .calc-out {
      display: flex; align-items: baseline; gap: 12px;
      font-family: var(--font-mono);
      font-size: 52px;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-top: 12px;
      color: #0F172A;
    }
    .calc-out .vs { font-size: 14px; color: var(--text-muted); font-family: var(--font-body); letter-spacing: 0; }

    .compare-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .compare-table th, .compare-table td { padding: 14px 20px; text-align: center; border-bottom: 1px solid var(--border); }
    .compare-table th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #0F172A; font-weight: 700; background: #F1F5F9; font-family: var(--font-mono); }
    .compare-table th:first-child, .compare-table td:first-child { text-align: left; color: #0F172A; }
    .og-col { color: #E8443A; font-weight: 700; }
    .ck::before { content: ""; display: inline-block; width: 18px; height: 18px; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2310B981' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='20 6 9 17 4 12'/></svg>"); background-size: 14px; background-position: center; background-repeat: no-repeat; }
    .cx { color: #94A3B8; }

    .faq-q { padding: 18px 0; border-top: 1px solid var(--border); display: flex; justify-content: space-between; cursor: default; }
    .faq-q h3, .faq-q h4 { font-family: var(--font-display); font-size: 16px; font-weight: 600; margin: 0; color: #0F172A; }
    .faq-q + .faq-a { color: var(--text-muted); font-size: 14px; line-height: 1.6; padding: 0 0 18px; max-width: 760px; }
  </style>
