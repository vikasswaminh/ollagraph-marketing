<style>
    .plans { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .plan {
      padding: 28px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      display: flex; flex-direction: column;
      position: relative;
    }
    .plan.featured {
      background: linear-gradient(180deg, rgba(199,247,81,0.06), rgba(199,247,81,0.02) 60%, var(--card));
      border-color: rgba(199,247,81,0.32);
      box-shadow: 0 0 0 1px rgba(199,247,81,0.12), 0 30px 80px -30px rgba(199,247,81,0.18);
    }
    .plan h3 { font-family: var(--font-display); font-size: 18px; font-weight: 500; margin: 0; letter-spacing: -0.01em; }
    .plan-price { font-family: var(--font-display); font-size: 48px; font-weight: 500; letter-spacing: -0.04em; line-height: 1; margin: 18px 0 8px; }
    .plan-price .unit { font-size: 14px; color: var(--text-muted); margin-left: 4px; letter-spacing: 0; }
    .plan-sub { font-size: 13.5px; color: var(--text-muted); }
    .plan ul { list-style: none; padding: 0; margin: 24px 0 0; display: flex; flex-direction: column; gap: 12px; font-size: 13.5px; }
    .plan ul li { display: flex; align-items: flex-start; gap: 10px; color: var(--text); }
    .plan ul li::before {
      content: "";
      width: 16px; height: 16px;
      border-radius: 999px; background: var(--accent-glow);
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23c7f751' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='20 6 9 17 4 12'/></svg>");
      background-size: 11px; background-position: center; background-repeat: no-repeat;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .plan ul li .muted { color: var(--text-muted); font-size: 12px; display: block; }
    .plan-cta { margin-top: 28px; }
    .plan-tag { position: absolute; top: -10px; right: 28px; background: var(--accent); color: var(--accent-ink); font-family: var(--font-mono); font-size: 10.5px; font-weight: 600; padding: 4px 9px; border-radius: 4px; letter-spacing: 0.04em; }

    .calc {
      padding: 32px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
    }
    .slider-wrap { position: relative; }
    .slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      background: linear-gradient(90deg, var(--accent) 0%, var(--accent) var(--pct, 25%), rgba(255,255,255,0.07) var(--pct, 25%));
      border-radius: 6px;
      outline: none;
    }
    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px; height: 20px;
      border-radius: 999px;
      background: #fff;
      border: 3px solid var(--accent);
      box-shadow: 0 0 12px rgba(199,247,81,0.5);
      cursor: pointer;
    }
    .slider::-moz-range-thumb {
      width: 20px; height: 20px;
      border-radius: 999px;
      background: #fff;
      border: 3px solid var(--accent);
      cursor: pointer;
    }
    .calc-out {
      display: flex; align-items: baseline; gap: 12px;
      font-family: var(--font-display);
      font-size: 56px;
      letter-spacing: -0.04em;
      margin-top: 12px;
    }
    .calc-out .vs { font-size: 14px; color: var(--text-muted); font-family: var(--font-body); letter-spacing: 0; }

    .compare-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    .compare-table th, .compare-table td { padding: 14px 20px; text-align: center; border-bottom: 1px solid var(--border); }
    .compare-table th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); font-weight: 500; background: rgba(255,255,255,0.02); }
    .compare-table th:first-child, .compare-table td:first-child { text-align: left; }
    .og-col { color: var(--accent); }
    .ck::before { content: ""; display: inline-block; width: 18px; height: 18px; border-radius: 999px; background: var(--accent-glow); border: 1px solid rgba(199,247,81,0.4); background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23c7f751' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='20 6 9 17 4 12'/></svg>"); background-size: 12px; background-position: center; background-repeat: no-repeat; }
    .cx { color: var(--text-dim); }

    .faq-q { padding: 18px 0; border-top: 1px solid var(--border); display: flex; justify-content: space-between; cursor: default; }
    .faq-q h4 { font-family: var(--font-display); font-size: 16px; font-weight: 500; margin: 0; }
    .faq-q + .faq-a { color: var(--text-muted); font-size: 14px; line-height: 1.6; padding: 0 0 18px; max-width: 720px; }
  </style>
