<style>
    body { background: #06060a; }
    .bg-grid { display: none; }
    .app { display:grid; grid-template-columns: 240px 1fr; min-height:100vh; position:relative; z-index:1; }
    .ap-side { border-right: 1px solid var(--border); background: rgba(0,0,0,0.2); padding: 16px 12px; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
    .side-brand { display:flex; align-items:center; gap:10px; padding:6px 10px 18px; font-family: var(--font-display); font-weight:600; font-size:15px; }
    .side-brand svg { width:20px; height:20px; }
    .side-ws { display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px; background:rgba(255,255,255,0.03); border:1px solid var(--border); font-size:12.5px; margin-bottom:18px; }
    .side-ws-mark { width:22px; height:22px; border-radius:6px; background:linear-gradient(135deg,#c7f751,#5eead4); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; }
    .side-group { display:flex; flex-direction:column; gap:1px; margin-bottom:18px; }
    .side-group-h { font-size:11px; text-transform:uppercase; letter-spacing:0.12em; color:var(--text-dim); padding:6px 10px; margin-top:4px; }
    .side-item { display:flex; align-items:center; gap:10px; padding:7px 10px; border-radius:7px; font-size:13px; color:var(--text-muted); cursor:default; }
    .side-item:hover { background:rgba(255,255,255,0.04); color:var(--text); }
    .side-item.active { background:rgba(199,247,81,0.08); color:var(--text); }
    .side-item.active svg { color: var(--accent); }
    .side-item svg { width:15px; height:15px; color: var(--text-dim); flex-shrink:0; }
    .side-bottom { margin-top:auto; padding:12px 10px; font-size:12px; color:var(--text-muted); display:flex; align-items:center; gap:10px; border-top: 1px solid var(--border); }
    .side-bottom .avatar { width: 26px; height: 26px; border-radius: 999px; background: linear-gradient(135deg, #a78bfa, #5eead4); }

    .ap-main { display:flex; flex-direction:column; min-width:0; }
    .ap-top { height:56px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:14px; padding:0 24px; background:rgba(0,0,0,0.2); position:sticky; top:0; z-index:10; backdrop-filter:blur(20px); }

    .breadcrumb .sep { color: var(--text-faint); }
    .breadcrumb .last { color: var(--text); }
    .ap-body { padding:24px; display:flex; flex-direction:column; gap:20px; }

    .card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius-lg); }
    .card-h { display:flex; align-items:center; justify-content:space-between; padding:13px 18px; border-bottom:1px solid var(--border); }
    .card-title { font-size:13.5px; font-weight:500; }
    .card-sub { font-size:12px; color:var(--text-muted); margin-top:1px; }
    .ctrl { height:32px; padding:0 12px; border-radius:7px; background:rgba(255,255,255,0.04); border:1px solid var(--border-2); font-size:12.5px; color:var(--text); display:inline-flex; align-items:center; gap:7px; }
    .ctrl svg { width:13px; height:13px; color:var(--text-muted); }

    .row-21 { display:grid; grid-template-columns: 1.6fr 1fr; gap:16px; }
    .row-12 { display:grid; grid-template-columns: 1fr 1.6fr; gap:16px; }
    .row-3 { display:grid; grid-template-columns: repeat(3,1fr); gap:16px; }
    .row-2 { display:grid; grid-template-columns: 1fr 1fr; gap:16px; }

    @media (max-width:1240px) { .row-21,.row-12,.row-3,.row-2 { grid-template-columns: 1fr; } }

  </style>
